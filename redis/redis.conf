# Shared Redis for the GrowClinic platform.
# Reachable only on the private growclinic-network (no published port).
# Users/passwords come from the ACL file rendered at container start (see
# docker-compose.yml): `default` may only PING (health check); each app has its
# own user restricted to its key prefix (audit:*, gmb:*) and without
# @dangerous commands (FLUSHALL, KEYS, CONFIG, DEBUG, …).

bind 0.0.0.0
port 6379
# ACL users with passwords protect access; the default user can only PING.
protected-mode no

# Persistence: handoff tokens are short-lived but should survive a restart.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
dir /data

# Memory: tokens/caches only. Evict keys that carry a TTL first; never
# silently drop keys without one.
maxmemory 128mb
maxmemory-policy volatile-lru

tcp-keepalive 60
timeout 0
loglevel notice
