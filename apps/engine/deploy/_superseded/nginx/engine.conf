# Nginx for engine.growclinic.io
# NOTE: the 443 server block references the Let's Encrypt cert. On a brand-new
# server that cert does not exist yet, so Nginx will fail to start.
# Follow the README "First-time SSL bootstrap" step: run with ONLY the port-80
# block first, issue the cert, then add the 443 block and reload.

server {
    listen 80;
    server_name engine.growclinic.io;

    # ACME HTTP-01 challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name engine.growclinic.io;

    ssl_certificate     /etc/letsencrypt/live/engine.growclinic.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engine.growclinic.io/privkey.pem;

    # Allow lead payloads / uploads
    client_max_body_size 25m;

    # Proxy to the Next.js engine app
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
