# Nixpacks build config for Railway / Coolify / etc.
# better-sqlite3 is a native module — needs python3 + gcc at install time

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci --omit=dev || npm install --omit=dev"]

[start]
cmd = "node server.js"
