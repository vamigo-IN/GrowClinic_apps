# ─────────────────────────────────────────────────────────────────────────────
# GrowClinic platform reverse proxy (single Nginx for all four applications).
#
# Local:      browser → 127.0.0.1:18080 → this proxy → app containers
# Production: Internet → existing VPS Nginx (TLS, 80/443)
#                      → 127.0.0.1:<verified port> → this proxy → app containers
#
# TLS is terminated by the VPS Nginx, so this proxy speaks plain HTTP on the
# private Docker network and forwards the original scheme/host.
# ─────────────────────────────────────────────────────────────────────────────
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65s;

    # ── Real client IP ────────────────────────────────────────────────────────
    # Only a proxy on a private address (the VPS Nginx via the Docker gateway,
    # or Docker itself) is trusted to supply X-Forwarded-For. With
    # real_ip_recursive, spoofed entries a client prepends are ignored.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Keep the scheme the edge proxy saw (https in production); fall back to
    # this hop's scheme for direct local access.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # ── Logging: JSON to stdout (Docker rotates it) ───────────────────────────
    # $uri, not $request_uri: query strings can carry secrets (?key=…, ?code=…,
    # handoff tokens) and must not end up in logs.
    log_format platform escape=json
        '{"time":"$time_iso8601","host":"$host","client":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
        '"ua":"$http_user_agent"}';
    access_log /dev/stdout platform;

    # ── Compression (Express apps don't compress; Next.js responses pass through) ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    client_max_body_size 2m;

    # Upstream timeout defaults (locations may raise them, e.g. audit reports).
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Rate limiting (per real client IP) ─────────────────────────────────────
    # Audit and GMB have their own in-app limiters; these cover endpoints that
    # had none (NextAuth credentials login, public form posts, lead ingest).
    limit_req_zone $binary_remote_addr zone=login:10m        rate=10r/m;
    # POSTs only — for logins submitted as Next.js server actions to a page URL,
    # where the page itself (GET) must stay unthrottled. Empty key = not limited.
    map $request_method $login_post_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_post_key     zone=login_post:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=forms:10m        rate=30r/m;
    limit_req_zone $binary_remote_addr zone=lead_ingest:10m  rate=120r/m;
    limit_req_status 429;

    # ── Upstreams: Docker DNS, re-resolved so recreated containers are found ──
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream growclinic_app {
        zone growclinic_app 64k;
        server growclinic:3000 resolve;
        keepalive 16;
    }
    upstream audit_app {
        zone audit_app 64k;
        server audit:3000 resolve;
        keepalive 16;
    }
    upstream gmb_app {
        zone gmb_app 64k;
        server gmb:3000 resolve;
        keepalive 16;
    }
    upstream engine_app {
        zone engine_app 64k;
        server engine:3000 resolve;
        keepalive 16;
    }

    # Unknown hosts get nothing; /healthz is for the container health check.
    server {
        listen 80 default_server;
        server_name _;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 444;
        }
    }

    include /etc/nginx/conf.d/*.conf;
    # Opt-in extras mounted by override files (e.g. compose.local-https.yml).
    include /etc/nginx/optional.d/*.conf;
}
