# engine.growclinic.io — multi-tenant CRM, public lead-ingest API, embed.js
server {
    listen 80;
    server_name engine.growclinic.io
                engine.growclinic.localhost engine.growclinic.local;

    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;

    # Public cross-origin lead ingest (CORS + activation key checks stay in the app).
    location = /api/ingest/lead {
        limit_req zone=lead_ingest burst=30 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://engine_app;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://engine_app;
    }
}
