# www.growclinic.io — Next.js marketing site + admin (apps/GrowClinic-main)

# Canonical host is www (metadataBase, canonical tags, sitemap, robots, IndexNow).
# The apex only redirects, so search engines never see duplicate hosts.
server {
    listen 80;
    server_name growclinic.io;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        return 301 https://www.growclinic.io$request_uri;
    }
}

server {
    listen 80;
    server_name www.growclinic.io
                growclinic.localhost growclinic.local;

    # Admin image uploads (/api/upload caps files at 10 MB; /api/admin/media) —
    # the 2 MB platform default would reject them.
    client_max_body_size 12m;

    include /etc/nginx/snippets/security-headers.conf;

    # NextAuth credentials login has no in-app throttling.
    location = /api/auth/callback/credentials {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://growclinic_app;
    }

    # The admin login form posts a server action to /admin/login (NextAuth signIn),
    # which never touches the callback URL above — throttle its POSTs as well.
    location = /admin/login {
        limit_req zone=login_post burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://growclinic_app;
    }

    # Each call runs a DB query (scheduled publishing) and may revalidate pages.
    # The container health check calls the app directly, not through this proxy.
    location = /api/health {
        limit_req zone=forms burst=10 nodelay;
        access_log off;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://growclinic_app;
    }

    # Public form endpoints (spam / abuse protection).
    location ~ ^/api/(contact|bookings|leads|audit|audit-intake)$ {
        limit_req zone=forms burst=10 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://growclinic_app;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://growclinic_app;
    }
}
