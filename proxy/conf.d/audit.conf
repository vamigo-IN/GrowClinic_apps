# audit.growclinic.io — Express AI audit tool + CRM admin
server {
    listen 80;
    server_name audit.growclinic.io
                audit.growclinic.localhost audit.growclinic.local;

    # The app sets its own CSP / X-Frame-Options / nosniff / HSTS — no
    # security-headers include here (it would duplicate them).
    client_max_body_size 2m;

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        # AI report generation (Gemini + OpenAI + PageSpeed) can hold a request
        # for well over a minute.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://audit_app;
    }
}
