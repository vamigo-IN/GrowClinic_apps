# gmb.growclinic.io — Vite SPA + Express API
server {
    listen 80;
    server_name gmb.growclinic.io
                gmb.growclinic.localhost gmb.growclinic.local;

    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://gmb_app;
    }
}
