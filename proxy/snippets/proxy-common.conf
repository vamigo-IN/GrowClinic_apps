# Shared upstream settings (included inside location blocks).
proxy_http_version 1.1;
proxy_set_header Connection "";

# $http_host keeps the port for local access (growclinic.localhost:18080), so
# apps that build absolute URLs from Host (NextAuth, Express redirects) are right.
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# One address only — the real client resolved by real_ip. Apps use
# `trust proxy 1`, so a single normalised entry is what they must see.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;

# Timeouts are set at http{} level in nginx.conf so a location can override them.

proxy_hide_header X-Powered-By;
