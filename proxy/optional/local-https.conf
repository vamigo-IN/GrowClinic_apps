# Local-only HTTPS listener (mounted by compose.local-https.yml).
# Terminates TLS with an mkcert certificate and routes by host exactly like
# the port-80 servers. Not used in production.
map $host $local_https_upstream {
    growclinic.localhost         growclinic_app;
    audit.growclinic.localhost   audit_app;
    gmb.growclinic.localhost     gmb_app;
    engine.growclinic.localhost  engine_app;
}

server {
    listen 443 ssl;
    http2 on;
    server_name growclinic.localhost audit.growclinic.localhost
                gmb.growclinic.localhost engine.growclinic.localhost;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 300s;
        proxy_pass http://$local_https_upstream;
    }
}
